services:
  mysql:
    image: mysql:8.0
    container_name: wallpaper_mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-wallpaper_db}
      MYSQL_USER: ${DB_USER:-wallpaper}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wallpaper123}
    ports:
      - "3306:3306"
    volumes:
      # 持久化 MySQL 数据
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: wallpaper_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-wallpaper}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD:-wallpaper123}}
      DB_NAME: ${DB_NAME:-wallpaper_db}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-secret-key}
      # 初始管理员（仅首次无 admin 用户时生效）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      # 注册验证开关（会被 DB 中 auth_config 覆盖）
      REGISTER_REQUIRE_EMAIL: ${REGISTER_REQUIRE_EMAIL:-true}
      REGISTER_ENABLE_EMAIL_VERIFY: ${REGISTER_ENABLE_EMAIL_VERIFY:-false}
      REGISTER_ENABLE_SMS_VERIFY: ${REGISTER_ENABLE_SMS_VERIFY:-false}
      SMS_PROVIDER: ${SMS_PROVIDER:-aliyun}
      # 邮箱 SMTP 配置
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-多点壁纸}
      # 阿里云短信配置
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      # 云片短信配置
      YUNPIAN_API_KEY: ${YUNPIAN_API_KEY:-}
      # 华为 OAuth 配置（预留）
      HUAWEI_CLIENT_ID: ${HUAWEI_CLIENT_ID:-}
      HUAWEI_CLIENT_SECRET: ${HUAWEI_CLIENT_SECRET:-}
      # 阿里云 OSS（可在后台动态配置，优先级更高）
      OSS_ENABLED: ${OSS_ENABLED:-false}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN:-}
      OSS_PATH_PREFIX: ${OSS_PATH_PREFIX:-wallpapers/}
      OSS_SIGNED_URL: ${OSS_SIGNED_URL:-false}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
    ports:
      - "8082:8082"
    volumes:
      # 持久化上传文件（图片不会丢失）
      - uploads:/app/uploads

volumes:
  mysql_data:
  uploads:
